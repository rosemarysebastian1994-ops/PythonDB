{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h2>Register</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex justify-content-center">
        <input type="submit" class="btn btn-primary">
    </div>
</form>
<p>
    Already have an account?
    <a href="{% url 'college:login' %}">Login</a>
</p>
{% endblock %}
