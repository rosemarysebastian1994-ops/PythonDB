{% extends 'teacher_dashboard.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Select a Course to Mark Attendance</h2>

    <div class="row">

        {% for course in courses %}

        <div class="col-md-4 mb-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>{{ course.course_name }}</h4>

                    <p>
                        Course Code:
                        <strong>{{ course.course_code }}</strong>
                    </p>

                    <a
                        href="{% url 'college:mark_attendance' course.id %}"
                        class="btn btn-primary">

                        Mark Attendance

                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <p>You don't have any courses assigned.</p>

        {% endfor %}

    </div>

</div>

{% endblock %}
