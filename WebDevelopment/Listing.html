<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Ordered Listing</h1>
<ol type="a">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ol>
<h1>Unordered Listing</h1>
<ul type="square">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ul>
<h1>Description Listing</h1>
<dl>
    <dt>Item 1</dt>
    <dd>Description 1</dd>
    <dt>Item 2</dt>
    <dd>Description 2</dd>
    <dt>Item 3</dt>
    <dd>Description 3</dd>
</dl>
</body>
</html>
