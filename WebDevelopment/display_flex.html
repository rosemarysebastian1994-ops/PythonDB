<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .parent{
            min-height:800px;
            width:50%;
            border:3px solid red;
            margin:auto;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .child1{
            height:200px;
            width:200px;
            border:2px solid red;
            background-color:red;
        }
        .child2{
            height:200px;
            width:200px;
            border:2px solid yellow;
            background-color:yellow;
        }
        .child3{
            height:200px;
            width:200px;
            border:2px solid orange;
            background-color:orange;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
    </div>
</body>
</html>
