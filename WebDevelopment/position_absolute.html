<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .parent{
            height:200px;
            width: 400px;
            border: 3px solid red;
            position:relative;
        }
        .child{
            height: 100px;
            width: 200px;
            border: 3px solid green;
            position:absolute;
            top:100px;
            right:20px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
</body>
</html>
