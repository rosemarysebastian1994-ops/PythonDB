<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <style>
        body{
            background-color:pink;
            background-image:url(pink.avif);
            background-repeat:no-repeat;
            background-size:cover;
        }
    </style>
</head>
<body>
    <form>
        <h1>Enter your personal details below:</h1>
        <label>Name</label>
        <input type="text">
        <br><br>
        <label>Address</label>
        <input type="text">
        <br><br>
        <label>City</label>
        <input type="text">
        <label>State</label>
        <input type="text">
        <br><br>
        <label>Country</label>
        <select name="c">
            <option value="australia">Australia</option>
            <option value="canada">Canada</option>
            <option value="china">China</option>
            <option value="germany">Germany</option>
            <option value="india">India</option>
            <option value="newzealand">New Zealand</option>
            <option value="pakistan">Pakistan</option>
            <option value="switzerland">Switzerland</option>
            <option value="uk">UK</option>
            <option value="usa">USA</option>
        </select>
        <label>Postal Code</label>
        <input type="number">
        <br><br>
        <label>E-mail Address</label>
        <input type="email">
        <br><br>
        <label>Sex</label>
        <input type="radio" value="male" name="s">Male
        <input type="radio" value="female" name="s">Female
        <input type="radio" value="other" name="s">Other
        <br><br>
        <label>Specify your interest</label>
        <br><br>
        <input type="checkbox" value="reading" name="n1">Reading
        <input type="checkbox" value="swimming" name="n2">Swimming
        <input type="checkbox" value="singing" name="n3">Singing
        <br><br>
        <input type="checkbox" value="yoga" name="n4">Yoga
        <input type="checkbox" value="dancing" name="n5">Dancing
        <input type="checkbox" value="hiking" name="n6">Hiking
        <br><br>
        <label>Mention the websites you like</label>
        <br><br>
        <textarea rows="10" cols="30">Write here</textarea>
        <br><br>
        <label>Rate my web page</label>
        <input type="radio" value="bad" name="r">Bad
        <input type="radio" value="ok" name="r">OK
        <input type="radio" value="good" name="r">Good
        <input type="radio" value="verygood" name="r">Very Good
        <br><br>
        <h3>Thanks for visiting!</h3>
        <br>
        <input type="submit">
        <input type="reset" value="Start Again">
    </form>
</body>
</html>
