<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .parent{
            height:500px;
            width:500px;
            border:3px solid red;
            margin:auto;
        }
        .child1{
            height:100px;
            width:100px;
            border:2px solid black;
            margin:auto;
        }
        .child2{
            height:100px;
            width:100px;
            border:2px solid blue;
            margin-top:100px;
        }
        .child3{
            height:100px;
            width:100px;
            border:2px solid blue;
            margin-left:auto;
            margin-top:30px;
            background-color:yellow;
        }
        h1{
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1"><h1>One</h1></div>
        <div class="child2"><h1>Two</h1></div>
        <div class="child3"><h1>Three</h1></div>
    </div>
</body>
</html>
