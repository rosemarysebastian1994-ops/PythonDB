<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-info">
    <div class="container">
        <form>
            <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" class="form-control">
  </div>
            <div class="mb-3">
    <label class="form-label">Email address</label>
    <input type="email" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control">
  </div>
            <div class="mb-3">
    <label class="form-label">DOB</label>
    <input type="date" class="form-control">
  </div>
            <div class="mb-3">
    <label class="form-label">Address</label>
                <textarea class="form-control" placeholder="aldjflasjl"></textarea>
  </div>
            <div class="mb-3">
                <label class="form-label">Your Interests: </label>
                <div class="form-check form-check-inline">
  <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="reading">
  <label class="form-check-label" for="inlineCheckbox1">Reading</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="music">
  <label class="form-check-label" for="inlineCheckbox2">Music</label>
</div>
                <div class="form-check form-check-inline">
  <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="sports">
  <label class="form-check-label" for="inlineCheckbox1">Sports</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="acting">
  <label class="form-check-label" for="inlineCheckbox2">Acting</label>
</div>
</div>
            <div class="mb-3">
                <label class="form-label">Gender: </label>
                <div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="male">
  <label class="form-check-label" for="inlineRadio1">Male</label>
</div>
                <div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="female">
  <label class="form-check-label" for="inlineRadio1">Female</label>
</div>
                <div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="other">
  <label class="form-check-label" for="inlineRadio1">Other</label>
</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Select the course: </label>
                <select class="form-select" aria-label="Default select example">
  <option selected>Open this select menu</option>
  <option value="1">B. Tech.</option>
  <option value="2">BCA</option>
  <option value="3">MCA</option>
</select>
</div>
            <div class="mb-3">
    <label class="form-label">Send CV</label>
    <input type="file" class="form-control">
  </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
