<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table,th,td{
            border:1px solid black;
            border-collapse:collapse;
            padding:10px;
        }
        table{
            margin:auto;
        }
    </style>
</head>
<body>
    <table>
        <tr>
           <th colspan="6">Time Table</th>
        </tr>
        <tr>
            <th rowspan="6">Hours</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
        </tr>
        <tr>
            <td>English</td>
            <td>Maths</td>
            <td>Hindi</td>
            <td>Science</td>
            <td>English</td>
        </tr>
        <tr>
            <td>Maths</td>
            <td>Hindi</td>
            <td>Science</td>
            <td>English</td>
            <td>Maths</td>
        </tr>
        <tr>
            <th colspan="5">Lunch</th>
        </tr>
        <tr>
            <td>Hindi</td>
            <td>Science</td>
            <td>English</td>
            <td>Maths</td>
            <td rowspan="2">Project</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>English</td>
            <td>Maths</td>
            <td>Hindi</td>
        </tr>
    </table>
</body>
</html>
