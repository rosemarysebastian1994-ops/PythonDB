<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form>
        <label>Username</label>
        <input type="text">
        <br>
        <br>
        <label>Password</label>
        <input type="password">
        <br>
        <br>
        <label>DOB</label>
        <input type="date">
        <br>
        <br>
        <label>e-mail</label>
        <input type="email">
        <br>
        <br>
        <label>Address</label>
        <textarea cols="30" rows="10">Write your address here!</textarea>
        <br>
        <br>
        <select name="q">
            <option value="btech">B.TECH</option>
            <option value="mtech">M.TECH</option>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
        </select>
        <br>
        <br>
        <label>Gender</label>
        <input type="radio" value="male" name="g">Male
        <input type="radio" value="female" name="g">Female
        <input type="radio" value="others" name="g">Other
        <br>
        <br>
        <label>Hobbies</label>
        <input type="checkbox" value="reading" name="n1">Reading
        <input type="checkbox" value="music" name="n2">Music
        <input type="checkbox" value="yoga" name="n3">Yoga
        <br>
        <br>
        <label>Send your CV</label>
        <input type="file">
        <br>
        <br>
        <input type="reset" value="Start Again!">
        <br>
        <br>
        <input type="submit" value="Click">
    </form>
</body>
</html>
