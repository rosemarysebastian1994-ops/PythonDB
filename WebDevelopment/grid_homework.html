<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <form>
            <div class="row">
                <div class="col-6">
                    <div class="mb-3">
                      <label class="form-label">Email address</label>
                      <input type="email" class="form-control">
                    </div>
                </div>
                <div class="col-6">
                    <div class="mb-3">
                      <label class="form-label">Password</label>
                      <input type="password" class="form-control">
                    </div>
                </div>
            </div>
            <div class="row">
              <div class="col-12">
                    <div class="mb-3">
                      <label class="form-label">Address 1</label>
                      <textarea class="form-control" placeholder="123 Maple Street, Springfield"></textarea>
                    </div>
              </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="mb-3">
                      <label class="form-label">Address 2</label>
                      <textarea class="form-control" placeholder="456 Business Rd., Chicago"></textarea>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <div class="mb-3">
                      <label class="form-label">City</label>
                      <input type="text" class="form-control">
                    </div>
                </div>
                <div class="col-4">
                    <div class="mb-3">
                      <label class="form-label">State</label>
                      <select class="form-select" aria-label="Default select example">
                        <option selected>Open this select menu</option>
                        <option value="1">California</option>
                        <option value="2">Alaska</option>
                        <option value="3">Florida</option>
                        <option value="4">New York</option>
                        <option value="5">Texas</option>
                      </select>
                    </div>
                </div>
                <div class="col-2">
                    <div class="mb-3">
                      <label class="form-label">ZIP</label>
                      <input type="number" class="form-control">
                    </div>
                </div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="remember">
              <label class="form-check-label" for="inlineCheckbox1">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
