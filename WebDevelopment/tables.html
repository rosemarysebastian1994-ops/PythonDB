<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table, th, td{
        border:3px solid red;
        border-collapse:collapse;
        padding:5px;
        }
        table{
        width:50%;
        }
        caption{
            text-align:center;
            font-size:35px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <table>
        <caption>Student Details</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Place</th>
        </tr>
        <tr>
            <td>Anu</td>
            <td>23</td>
            <td>Ekm</td>
        </tr>
        <tr>
            <td>Amal</td>
            <td>24</td>
            <td>Tcr</td>
        </tr>
    </table>
</body>
</html>
